name: Contrib Miner GIF
description: Render your GitHub contribution graph as an 8-bit mining GIF.
author: aserenaa
branding:
  icon: image
  color: purple

inputs:
  github_user_name:
    description: GitHub login whose contributions are rendered.
    default: ${{ github.repository_owner }}
  year:
    description: A calendar year such as 2025. Empty means the last twelve months.
    default: ""
  output:
    description: Path of the GIF to write.
    default: dist/miner.gif
  theme:
    description: Theme of the main GIF, dark or light.
    default: dark
  season:
    description: Seasonal dressing - none, auto (Halloween or Christmas from the run date), halloween or christmas.
    default: none
  light_output:
    description: Optional path for a second, light-theme GIF rendered from the same data.
    default: ""
  scale:
    description: Integer upscale factor for crisp pixels (1-8).
    default: "2"
  max_seconds:
    description: Target loop length in seconds. Busy years speed up to fit; 0 keeps the natural speed.
    default: "25"
  github_token:
    description: Token used for the GraphQL API. The default token sees public contributions only.
    default: ${{ github.token }}

outputs:
  path:
    description: Path of the generated GIF.
    value: ${{ inputs.output }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install contrib-miner
      shell: bash
      run: pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}
    - name: Render GIF
      shell: bash
      run: |
        args=(--user "$USER_NAME" --output "$OUTPUT" --theme "$THEME" --season "$SEASON" --scale "$SCALE" --max-seconds "$MAX_SECONDS")
        if [ -n "$LIGHT_OUTPUT" ]; then args+=(--light-output "$LIGHT_OUTPUT"); fi
        if [ -n "$YEAR" ]; then args+=(--year "$YEAR"); fi
        contrib-miner "${args[@]}"
      env:
        USER_NAME: ${{ inputs.github_user_name }}
        OUTPUT: ${{ inputs.output }}
        THEME: ${{ inputs.theme }}
        SEASON: ${{ inputs.season }}
        YEAR: ${{ inputs.year }}
        LIGHT_OUTPUT: ${{ inputs.light_output }}
        SCALE: ${{ inputs.scale }}
        MAX_SECONDS: ${{ inputs.max_seconds }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
