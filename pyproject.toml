[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contrib-miner"
version = "1.3.0"
description = "Render your GitHub contribution graph as an 8-bit mining GIF for your profile README."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abraham Serena" }]
requires-python = ">=3.10"
dependencies = ["pillow>=10", "requests>=2.31"]
keywords = ["github", "github-actions", "profile-readme", "pixel-art", "gif", "contributions"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/aserenaa/contrib-miner"
Issues = "https://github.com/aserenaa/contrib-miner/issues"
Changelog = "https://github.com/aserenaa/contrib-miner/blob/main/CHANGELOG.md"

[project.scripts]
contrib-miner = "contrib_miner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Sprite and font tables are easier to edit when each row stays on one line.
"src/contrib_miner/sprites.py" = ["E501"]
